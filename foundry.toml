[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = []

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 40
fail_on_revert = false

[lint]
exclude_lints = ["unsafe-typecast", "asm-keccak256", "mixed-case-function", "mixed-case-variable", "screaming-snake-case-const", "screaming-snake-case-immutable"]
